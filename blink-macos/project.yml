name: Blink
options:
  bundleIdPrefix: com.blink
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  BlinkCore:
    # HTTPS URL — works locally via gh CLI credential helper AND with
    # Xcode Cloud's GitHub App integration (which authenticates over
    # HTTPS, not SSH). Don't switch to the SSH alias (git@github-d4g4:…)
    # — that's a local ~/.ssh/config alias that Xcode Cloud can't
    # resolve. BlinkCore is still PRIVATE; access is gated by the
    # account's read permission on D4G4/blink-core.
    url: https://github.com/D4G4/blink-core.git
    from: "2.9.0"
  Sparkle:
    # Auto-update framework. EdDSA-signs each DMG so the user's Mac can
    # verify before installing — SUPublicEDKey in Info.plist must match
    # the private key in the developer's login Keychain (created via
    # ~/.local/sparkle-2.9.2/bin/generate_keys, signed via sign_update
    # at release time).
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

schemes:
  Blink:
    build:
      targets:
        Blink: all
        BlinkSnapshotTests: [test]
    test:
      targets:
        - BlinkSnapshotTests
    archive:
      config: Release
  # Dev-only harness that launches straight into the Gabor exercise UI.
  GaborDev:
    build:
      targets:
        GaborDev: all
    run:
      config: Debug

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
    dependencies:
      - package: BlinkCore
      - package: Sparkle
    info:
      path: Blink/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright 2026 Blink"
        # NSInputMonitoringUsageDescription is NOT auto-injected by Xcode's
        # INFOPLIST_KEY_* mechanism (Apple's allowlist only covers a fixed set
        # of well-known keys — Camera, Microphone, Calendars, etc.). It must
        # live in a real Info.plist file like this one or it silently drops.
        NSInputMonitoringUsageDescription: "Blink monitors keyboard and mouse timing to detect flow state and deliver breaks at the right moment. No keystrokes or content are recorded."
        NSMicrophoneUsageDescription: "Blink checks whether the microphone is in use so it can pause break reminders during calls. No audio is recorded or transmitted."
        # macOS 14+ EKEventStore.requestFullAccessToEvents() reads the
        # *FullAccess* key, NOT the legacy NSCalendarsUsageDescription — the
        # legacy key alone yields a silent denial. Both are declared: the
        # FullAccess key is load-bearing, the legacy key covers older readers.
        NSCalendarsFullAccessUsageDescription: "Blink reads your calendar to automatically pause break reminders during meetings. Event details stay on your Mac and are never recorded or transmitted."
        NSCalendarsUsageDescription: "Blink reads your calendar to automatically pause break reminders during meetings. Event details stay on your Mac and are never recorded or transmitted."
        # Sparkle auto-update wiring. SUPublicEDKey is the EdDSA public
        # key whose private half lives in the developer's login Keychain
        # (item: "https://sparkle-project.org"). sign_update uses the
        # private key at release time; the app uses the public key here
        # to verify each downloaded DMG before installing. Lose the
        # private key → no future signed updates possible. Sync the
        # login Keychain to iCloud.
        SUFeedURL: "https://blink20.net/appcast.xml"
        SUPublicEDKey: "agdJmL4C1ciE/qX6oEcxkZgc8fu264R45/vCfg09BKY="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink20.app
        MARKETING_VERSION: "5.2.0-beta.19"
        # CURRENT_PROJECT_VERSION (= CFBundleVersion) is the integer
        # Sparkle uses as its PRIMARY version comparator. The value here
        # is only a development/local-build placeholder — scripts/build-release.sh
        # overrides it with `git rev-list --count HEAD` so each release
        # ships with a monotonically-increasing build number. Do NOT
        # hardcode a specific number for shipping; every release must
        # have a higher CFBundleVersion than the previous one or
        # Sparkle answers "up to date" for users on prior versions
        # regardless of MARKETING_VERSION.
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    entitlements:
      path: Blink/Blink.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        # Read-only calendar access (EventKit) for meeting auto-pause. Required
        # under the sandbox for EKEventStore to enumerate events.
        com.apple.security.personal-information.calendars: true
        # Sparkle 2.x with sandboxing: the installer pipeline spans TWO
        # XPC services keyed off the host bundle ID:
        #   -spks → Installer Launcher (host app launches it to begin install)
        #   -spki → Installer Status (Updater.app reports progress back via it)
        # Per Sparkle's official sandboxed-sample entitlements file, both
        # are required. Missing -spki only manifests at install time —
        # find/download works (those use network.client), then install
        # fails with the generic "An error occurred while running the
        # updater" because the status channel is blocked. v5.0.0–v5.0.5
        # all shipped without -spki and Sparkle install never worked for
        # any user; v5.0.6 adds it.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "com.blink20.app-spks"
          - "com.blink20.app-spki"

  BlinkSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkSnapshotTests
    dependencies:
      - target: Blink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blink.app/Contents/MacOS/Blink"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        ENABLE_APP_SANDBOX: false

  # Dev-only harness app: boots directly into the Gabor exercise UI so it can
  # be launched and clicked through without the menu bar, onboarding, or
  # permissions. Compiles ONLY the GaborExercise files + BlinkTheme (no
  # BlinkCore/Sparkle/AppState), so it builds fast and stays isolated. Not
  # signed for distribution; never referenced by the release build.
  GaborDev:
    type: application
    platform: macOS
    sources:
      - GaborDev
      # GaborExerciseWindowController pulls in app-wide symbols (UIActionLogger)
      # and isn't needed — the dev app makes its own WindowGroup.
      - path: Blink/GaborExercise
        excludes:
          - GaborExerciseWindowController.swift
      - path: Blink/Theme/BlinkTheme.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.blink20.gabordev
        PRODUCT_NAME: GaborDev
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Dev-only harness: ad-hoc sign ("-") so it runs locally without a
        # Developer ID / Mac Development certificate. Never distributed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: false
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
