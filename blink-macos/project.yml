name: Blink
options:
  bundleIdPrefix: com.blink
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  BlinkCore:
    url: git@github-d4g4:D4G4/blink-core.git
    from: "1.9.0"

schemes:
  Blink:
    build:
      targets:
        Blink: all
        BlinkSnapshotTests: [test]
    test:
      targets:
        - BlinkSnapshotTests
    archive:
      config: Release

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
    dependencies:
      - package: BlinkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.blink20.app
        MARKETING_VERSION: "3.3.5"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: "Blink monitors keyboard and mouse timing to detect flow state and deliver breaks at the right moment. No keystrokes or content are recorded."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Blink"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    entitlements:
      path: Blink/Blink.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  BlinkSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkSnapshotTests
    dependencies:
      - target: Blink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blink.app/Contents/MacOS/Blink"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        ENABLE_APP_SANDBOX: false
