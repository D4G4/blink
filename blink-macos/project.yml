name: Blink
options:
  bundleIdPrefix: com.blink
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  BlinkCore:
    url: git@github-d4g4:D4G4/blink-core.git
    from: "2.5.0"

schemes:
  Blink:
    build:
      targets:
        Blink: all
        BlinkSnapshotTests: [test]
    test:
      targets:
        - BlinkSnapshotTests
    archive:
      config: Release

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
    dependencies:
      - package: BlinkCore
    info:
      path: Blink/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright 2026 Blink"
        # NSInputMonitoringUsageDescription is NOT auto-injected by Xcode's
        # INFOPLIST_KEY_* mechanism (Apple's allowlist only covers a fixed set
        # of well-known keys — Camera, Microphone, Calendars, etc.). It must
        # live in a real Info.plist file like this one or it silently drops.
        NSInputMonitoringUsageDescription: "Blink monitors keyboard and mouse timing to detect flow state and deliver breaks at the right moment. No keystrokes or content are recorded."
        NSMicrophoneUsageDescription: "Blink checks whether the microphone is in use so it can pause break reminders during calls. No audio is recorded or transmitted."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink20.app
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    entitlements:
      path: Blink/Blink.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true

  BlinkSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkSnapshotTests
    dependencies:
      - target: Blink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blink.app/Contents/MacOS/Blink"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6V6FZW3FFN
        ENABLE_APP_SANDBOX: false
