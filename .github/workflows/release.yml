name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows ──────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Test
        run: dotnet test blink-windows/src/Blink.Core.Tests/ -c Release

      - name: Publish
        run: |
          dotnet publish blink-windows/src/Blink.App/Blink.App.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o publish/${{ matrix.arch }}

      - name: Rename artifact
        run: |
          Move-Item publish/${{ matrix.arch }}/Blink.App.exe publish/${{ matrix.arch }}/Blink-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-${{ matrix.arch }}
          path: publish/${{ matrix.arch }}/Blink-${{ matrix.arch }}.exe

  # ── macOS (signed + notarized) ───────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 is REQUIRED — build-release.sh derives the
      # CFBundleVersion from `git rev-list --count HEAD`, which returns
      # 1 on a shallow (default) checkout. CFBundleVersion=1 = Sparkle
      # tells every installed user "you're up to date" regardless of
      # marketing version (see feedback_sparkle_uses_cfbundleversion).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SSH access to the private BlinkCore repo. The deploy key in the
      # BLINKCORE_DEPLOY_KEY secret is registered as a read-only deploy
      # key on D4G4/blink-core. The `github-d4g4` host alias mirrors the
      # local dev setup so the same SPM / git URLs work in both places.
      - name: Configure SSH for BlinkCore (private dependency)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BLINKCORE_DEPLOY_KEY }}" > ~/.ssh/blinkcore_deploy
          chmod 600 ~/.ssh/blinkcore_deploy
          cat >> ~/.ssh/config <<EOF
          Host github-d4g4
            HostName github.com
            User git
            IdentityFile ~/.ssh/blinkcore_deploy
            StrictHostKeyChecking no
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/blinkcore_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          # SPM resolves project.yml's HTTPS URL — rewrite it to use the
          # SSH alias so the deploy key authenticates the fetch.
          git config --global url."git@github-d4g4:D4G4/blink-core.git".insteadOf "https://github.com/D4G4/blink-core.git"

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Clone BlinkCore for tests
        run: git clone git@github-d4g4:D4G4/blink-core.git blink-macos/BlinkCore

      - name: Run BlinkCore tests
        run: cd blink-macos/BlinkCore && swift test

      # Import the Developer ID Application certificate into a fresh
      # temporary keychain. Pattern from Apple's docs + the standard
      # GH Actions code-signing recipe. Keychain is torn down when the
      # runner job completes — secrets never persist on disk.
      - name: Import Developer ID signing cert
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/cert.p12

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Sanity check — Developer ID Application identity should be visible
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Store the App Store Connect API key as a notarytool keychain
      # profile so xcrun notarytool can submit the DMG. Profile name
      # AC_NOTARY matches what scripts/build-release.sh expects.
      - name: Setup notarytool credentials
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${AC_API_KEY_ID}.p8
          echo -n "$AC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          xcrun notarytool store-credentials AC_NOTARY \
            --key "$KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID"

      # Resolve SPM packages early so generate_keys (ships inside the
      # Sparkle SPM checkout under DerivedData) exists before we try to
      # import the EdDSA private key. xcodegen runs again inside
      # build-release.sh — running it here is fine, idempotent.
      - name: Resolve SPM packages (needed to find generate_keys)
        run: |
          cd blink-macos
          xcodegen generate
          xcodebuild -project Blink.xcodeproj -scheme Blink \
            -resolvePackageDependencies > /dev/null

      # Stage the Sparkle EdDSA private key as a file. build-release.sh
      # picks it up via SPARKLE_PRIVATE_KEY_FILE and passes it to
      # `sign_update --ed-key-file`. We deliberately DO NOT import it
      # into a keychain on the runner — sign_update's default keychain
      # path triggers a "Allow access?" ACL prompt on first use, which
      # cannot be dismissed on a headless runner and hangs the job
      # forever. Was the root cause of the v5.0.0 release hangs.
      #
      # The key was exported once locally via
      #   ~/.local/sparkle-2.9.2/bin/generate_keys -x /tmp/sparkle.key
      # then base64-encoded into the SPARKLE_PRIVATE_KEY secret. Highest
      # trust secret in the repo — if it leaks, every shipped Blink is
      # stranded (no key-rotation story in Sparkle).
      - name: Decode Sparkle EdDSA private key to file
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e
          echo -n "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/sparkle.key"

      # Detect pre-release tags so we route them to the Sparkle beta
      # channel instead of broadcasting to everyone. Tag conventions:
      #   v5.1.0           → stable (no channel tag, all users get it)
      #   v5.1.0-beta.1    → beta   (sparkle:channel=beta in appcast item;
      #                              only users with "Receive beta updates"
      #                              ON via BlinkUpdater.allowedChannels
      #                              see the item)
      #   v5.1.0-rc.1      → beta   (release candidates ride the same
      #                              channel — they're not stable yet)
      - name: Determine release channel from tag
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc) ]]; then
            echo "flag=--channel beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "→ pre-release tag $GITHUB_REF_NAME → beta channel"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "→ stable tag $GITHUB_REF_NAME → no channel tag"
          fi

      # Build, sign, notarize, staple, AND EdDSA-sign for Sparkle in one
      # go via the build script. The SPARKLE_PRIVATE_KEY_FILE env var
      # routes sign_update to read the key from a file instead of the
      # keychain — bypasses the ACL prompt that hangs CI. Anything else
      # that's wrong (signing, notarization, Sparkle key mismatch) fails
      # here rather than producing a bad DMG. The script writes both
      # Blink.dmg and appcast-item.xml into blink-macos/build/.
      - name: Build signed + notarized + EdDSA-signed DMG
        env:
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: bash blink-macos/scripts/build-release.sh ${{ steps.channel.outputs.flag }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-macOS
          path: blink-macos/build/Blink.dmg

      # Separate artifact so the appcast job can pick up the snippet
      # without re-downloading the DMG.
      - name: Upload appcast item artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-appcast-item
          path: blink-macos/build/appcast-item.xml

  # ── GitHub Release ───────────────────────────────────────────────
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Pre-release tags (v*-beta.*, v*-rc.*) get marked as "Pre-release"
          # on GitHub so they don't show up as "Latest release" on the repo
          # home page. The Sparkle appcast still publishes them (with the
          # beta channel tag) so opted-in users receive them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/Blink-x64/Blink-x64.exe
            artifacts/Blink-arm64/Blink-arm64.exe
            artifacts/Blink-macOS/Blink.dmg

  # ── Publish Sparkle appcast + redeploy website ───────────────────
  # Must run after `release` so the DMG enclosure URL in the appcast
  # item is live by the time the appcast is published. Otherwise the
  # first user to fetch the new appcast would hit a 404 on download.
  #
  # Pushes use RELEASE_PAT (a fine-grained PAT scoped to D4G4/blink with
  # contents:write) instead of the default GITHUB_TOKEN. The repo's
  # ruleset on `main` requires PRs + signed commits, and the bypass list
  # exempts role-based actors (Repository admin / Write) which match
  # human users — github-actions[bot] is a service account and isn't
  # matched by role bypasses. The PAT acts as the human owner, who IS
  # in the bypass list, so the push succeeds.
  appcast:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          ref: main

      - name: Download appcast item
        uses: actions/download-artifact@v4
        with:
          name: Blink-appcast-item
          path: artifacts

      # Splice the new <item> into website/appcast.xml right after the
      # <language>en</language> tag (top of <channel>). awk handles the
      # multi-line insertion without us shelling out to sed.
      - name: Splice into website/appcast.xml
        run: |
          set -e
          awk '
            /<language>en<\/language>/ {
              print
              while ((getline line < "artifacts/appcast-item.xml") > 0)
                print line
              close("artifacts/appcast-item.xml")
              next
            }
            { print }
          ' website/appcast.xml > website/appcast.xml.new
          mv website/appcast.xml.new website/appcast.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/appcast.xml
          git commit -m "chore(appcast): publish ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      # Push the updated appcast to blink20.net so installed Blinks can
      # fetch it on their next scheduled check. Without this step the
      # commit lands in the repo but the live URL still serves the old
      # appcast — users would never see the update.
      - name: Deploy website (publishes new appcast)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  # ── Update Homebrew cask (notarized → no xattr workaround needed) ─
  # Stable releases only. Beta tags (v*-beta.*, v*-rc.*) skip this job —
  # the Homebrew cask points at the stable channel; beta users install the
  # beta DMG directly from the GitHub Release (or get it via Sparkle once
  # they've toggled "Receive beta updates" on a prior install).
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Wait for release assets
        run: sleep 10

      - name: Get DMG sha256
        id: sha
        run: |
          curl -sL "https://github.com/D4G4/blink/releases/download/${GITHUB_REF_NAME}/Blink.dmg" -o Blink.dmg
          echo "sha256=$(sha256sum Blink.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-blink
        uses: actions/checkout@v4
        with:
          repository: D4G4/homebrew-blink
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-blink

      - name: Update cask (version + sha + drop xattr postflight + auto_updates)
        run: |
          set -e
          cd homebrew-blink
          # Version + sha256
          sed -i 's/version ".*"/version "${{ steps.version.outputs.version }}"/' Casks/blink.rb
          sed -i 's/sha256 ".*"/sha256 "${{ steps.sha.outputs.sha256 }}"/' Casks/blink.rb
          # Remove the entire postflight block — the DMG is now signed
          # + notarized + stapled, so Gatekeeper trusts it on download
          # and the `xattr -cr` workaround is no longer needed.
          # Also add `auto_updates true` if it's not already there — tells
          # brew that the app self-updates via Sparkle, so it shouldn't be
          # surprised when the installed version drifts ahead of the cask
          # (which is the normal state once Sparkle pushes updates).
          python3 - <<'PY'
          import re
          path = "Casks/blink.rb"
          with open(path) as f:
              src = f.read()
          # Match `postflight do\n ... \nend\n` (one block, no nested do/end)
          src = re.sub(
              r"\n?[ \t]*postflight do\n(?:.*\n)*?[ \t]*end\n",
              "\n",
              src,
              count=1,
          )
          # Idempotent insert: only add `auto_updates true` if missing.
          # Place it right after the sha256 line so the cask file reads
          # cleanly top-to-bottom.
          if "auto_updates" not in src:
              src = re.sub(
                  r'(\n[ \t]*sha256 ".*?"\n)',
                  r'\1\n  auto_updates true\n',
                  src,
                  count=1,
              )
          with open(path, "w") as f:
              f.write(src)
          PY

      - name: Commit and push
        run: |
          cd homebrew-blink
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/blink.rb
          git diff --cached --quiet && exit 0
          git commit -m "Bump to v${{ steps.version.outputs.version }} (notarized)"
          git push
