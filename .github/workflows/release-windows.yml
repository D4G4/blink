name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Test
        run: dotnet test blink-windows/src/Blink.Core.Tests/ -c Release

      - name: Publish
        run: |
          dotnet publish blink-windows/src/Blink.App/Blink.App.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o publish/${{ matrix.arch }}

      - name: Rename artifact
        run: |
          $exe = Get-ChildItem publish/${{ matrix.arch }}/Blink.App.exe
          Move-Item $exe.FullName publish/${{ matrix.arch }}/Blink-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-${{ matrix.arch }}
          path: publish/${{ matrix.arch }}/Blink-${{ matrix.arch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: Blink-x64
          path: artifacts

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: Blink-arm64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Blink-x64.exe
            artifacts/Blink-arm64.exe
